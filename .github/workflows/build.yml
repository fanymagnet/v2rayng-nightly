name: Build latest v2rayNG

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  ABIS: armeabi-v7a arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        repository: 2dust/v2rayNG
        submodules: recursive

    - name: Update submodules to latest
      run: |
        for m in AndroidLibXrayLite hev-socks5-tunnel; do
          git -C $m fetch --depth=1 origin HEAD
          git -C $m checkout --detach FETCH_HEAD
          git -C $m submodule update --init --recursive --depth=1
        done
        {
          echo "- v2rayNG: \`$(git rev-parse --short HEAD)\`"
          echo "- AndroidLibXrayLite: \`$(git -C AndroidLibXrayLite rev-parse --short HEAD)\`"
          echo "- hev-socks5-tunnel: \`$(git -C hev-socks5-tunnel rev-parse --short HEAD)\`"
        } | tee -a "$RUNNER_TEMP/notes.md" >> $GITHUB_STEP_SUMMARY

    - name: Read toolchain versions from upstream
      id: tc
      run: |
        W=.github/workflows/build.yml
        cmdline=$(grep -oP "cmdline-tools-version: '\K[0-9]+" $W)
        packages=$(grep -oP "packages: '\K[^']+" $W)
        ndk=$(grep -oP 'ndk;\K[0-9.]+' $W | head -1)
        java=$(grep -oP "java-version: '\K[0-9]+" $W)
        test -n "$cmdline" && test -n "$packages" && test -n "$ndk" && test -n "$java"
        {
          echo "cmdline=$cmdline"
          echo "packages=$packages"
          echo "ndk=$ndk"
          echo "java=$java"
        } | tee -a $GITHUB_OUTPUT

    - uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: ${{ steps.tc.outputs.cmdline }}
        packages: ${{ steps.tc.outputs.packages }}

    - name: Install NDK
      env:
        NDK: ${{ steps.tc.outputs.ndk }}
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;$NDK"
        echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK" >> $GITHUB_ENV
        sed -i "10i\\
        \\
            ndkVersion = \"$NDK\"" V2rayNG/app/build.gradle.kts

    - uses: actions/setup-go@v6
      with:
        go-version: 'stable'
        cache-dependency-path: AndroidLibXrayLite/go.sum

    - uses: actions/setup-java@v6.0.1
      with:
        distribution: 'temurin'
        java-version: ${{ steps.tc.outputs.java }}

    - uses: gradle/actions/setup-gradle@v4

    - name: Build libhevtun
      run: |
        sed -i "s/^ABIS=.*/ABIS=\"$ABIS\"/" compile-hevtun.sh
        bash compile-hevtun.sh
        cp -r libs/. V2rayNG/app/libs/

    - name: Build libv2ray with latest xray-core
      working-directory: AndroidLibXrayLite
      run: |
        go get github.com/xtls/xray-core@main
        go get golang.org/x/mobile@latest
        go mod tidy
        go install golang.org/x/mobile/cmd/gomobile@latest
        mkdir -p assets data
        bash gen_assets.sh download
        cp -v data/*.dat assets/
        targets=$(for a in $ABIS; do
          case $a in
            armeabi-v7a) echo android/arm ;;
            arm64-v8a) echo android/arm64 ;;
            x86) echo android/386 ;;
            x86_64) echo android/amd64 ;;
          esac
        done | paste -sd,)
        gomobile init
        gomobile bind -v -target="$targets" -androidapi 24 -trimpath -ldflags='-s -w -buildid= -checklinkname=0' ./
        cp -v libv2ray.aar ../V2rayNG/app/libs/
        {
          echo "- xray-core: \`$(go list -m -f '{{.Version}}' github.com/xtls/xray-core)\`"
          echo "- go: \`$(go env GOVERSION)\`"
        } | tee -a "$RUNNER_TEMP/notes.md" >> $GITHUB_STEP_SUMMARY

    - name: Set build version
      working-directory: V2rayNG
      run: |
        sed -i -E 's/^(\s*versionName = ")([^"]+)"/\1\2-b${{ github.run_number }}"/' app/build.gradle.kts
        version=$(grep -oP '^\s*versionName = "\K[^"]+' app/build.gradle.kts)
        test -n "$version"
        echo "VERSION=$version" >> $GITHUB_ENV
        sed -i "1i - versionName: \`$version\`" "$RUNNER_TEMP/notes.md"

    - name: Build APK
      working-directory: V2rayNG
      env:
        KS_B64: ${{ secrets.APP_KEYSTORE_BASE64 }}
        KS_PASS: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        KS_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        KEY_PASS: ${{ secrets.APP_KEY_PASSWORD }}
      run: |
        echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.jks"
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        ./gradlew assemblePlaystoreRelease \
          -PABI_FILTERS="${ABIS// /;}" \
          -Pandroid.injected.signing.store.file="$RUNNER_TEMP/ks.jks" \
          -Pandroid.injected.signing.store.password="$KS_PASS" \
          -Pandroid.injected.signing.key.alias="$KS_ALIAS" \
          -Pandroid.injected.signing.key.password="$KEY_PASS"

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}
        name: v2rayNG ${{ env.VERSION }}
        body_path: ${{ runner.temp }}/notes.md
        make_latest: true
        files: V2rayNG/app/build/outputs/apk/*/release/*.apk
